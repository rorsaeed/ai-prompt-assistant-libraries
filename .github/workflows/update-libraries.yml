# Refreshes the published prompt libraries and their vectors (DEV-23 and DEV-27 / P05 of
# AI Prompt Assistant).
#
# The crawler walks each of the eight libraries once with the app's own sync code: the
# five on youmind.com's prompt API at the pace the app itself keeps (at most 25 pages a
# minute), the three GitHub collections file by file. It publishes the result to the
# `data` branch as one file per library beside `manifest.json`. Every copy of the app
# reads those files instead of reading the sources itself.
#
# It then embeds every entry that is new or changed since the last run with the app's
# pinned embedding model and publishes one vector file per library beside `vectors.json`,
# so no copy of the app has to embed a library. The model (about 128 MB, from
# huggingface.co, hash-checked) is cached between runs; ONNX Runtime is native, so it is
# installed here rather than bundled into crawler.cjs.
#
# The `data` branch is rewritten as a single commit on every run, so the repository does
# not grow by several megabytes each time a library changes.
name: Update prompt libraries

on:
  schedule:
    # Three times a day, off the hour.
    - cron: '23 1,9,17 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Libraries to crawl, by slug and comma-separated (empty: all eight). Vectors are built for all.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-libraries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The version the app ships with (package.json of AI Prompt Assistant). The crawler
      # finds it in node_modules beside crawler.cjs. Its install script would fetch CUDA
      # binaries, which a CPU runner never uses.
      - name: Install ONNX Runtime
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm install --no-save --no-package-lock --no-audit --no-fund onnxruntime-node@1.29.0

      # Changes exactly when the app pins another model, so a new model is fetched once
      # and the old one's cache is left to expire.
      - name: Name the embedding model
        id: model
        run: echo "key=embedding-model-$(node crawler.cjs --model-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ steps.model.outputs.key }}

      - name: Fetch the libraries as last published
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git clone --quiet --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" data
            rm -rf data/.git
          else
            mkdir data
          fi

      # --embed-minutes: no new batch of embeddings is started after 95 minutes, which
      # leaves the publish step well inside the job's 120. The first run embeds about
      # 49,000 entries; if it cannot finish them, the next run carries on, and an entry
      # with no vector yet is still found by its words in the app.
      - name: Crawl and embed
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            node crawler.cjs --out data --only "$ONLY" --vectors --model-dir models --embed-minutes 95
          else
            node crawler.cjs --out data --vectors --model-dir models --embed-minutes 95
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp DATA_README.md data/README.md
          cd data
          git init --quiet --initial-branch data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Prompt libraries, $(date --utc +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
